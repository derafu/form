# Reuses the shared Renderer and Twig services. Form contributes its own
# templates and extension through the shared provider collections.
imports:
    - { resource: '../../../renderer/resources/config/renderer-services.yaml' }

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Derafu\Form\Renderer\Support\InputActionResolver: ~

    Derafu\Form\Contract\Renderer\ElementRendererProviderInterface:
        class: Derafu\Form\Renderer\ChainElementRendererProvider
        arguments:
            $providers: !tagged_iterator derafu_form.element_renderer_provider

    Derafu\Form\Renderer\ElementRendererProvider:
        tags:
            - { name: derafu_form.element_renderer_provider, priority: -1000 }

    Derafu\Form\Contract\Renderer\WidgetRendererProviderInterface:
        class: Derafu\Form\Renderer\ChainWidgetRendererProvider
        arguments:
            $providers: !tagged_iterator derafu_form.widget_renderer_provider

    Derafu\Form\Renderer\WidgetRendererProvider:
        tags:
            - { name: derafu_form.widget_renderer_provider, priority: -1000 }

    Derafu\Form\Contract\Renderer\ElementRendererRegistryInterface:
        class: Derafu\Form\Renderer\ElementRendererRegistry
        arguments:
            $renderers: '@Derafu\Form\Contract\Renderer\ElementRendererProviderInterface'

    Derafu\Form\Contract\Renderer\WidgetRendererRegistryInterface:
        class: Derafu\Form\Renderer\WidgetRendererRegistry
        arguments:
            $renderers: '@Derafu\Form\Contract\Renderer\WidgetRendererProviderInterface'

    # Feeds resources/translations into the consuming app's Translator (the
    # app must pass $resourceProviders: !tagged_iterator
    # derafu_translation.resource_provider to TranslatorFactory::create(),
    # see derafu/translation's translation-services.yaml). The tag is
    # explicit because _instanceof does not propagate across imported files.
    Derafu\Form\Translation\FormTranslationResourceProvider:
        tags: ['derafu_translation.resource_provider']

    Derafu\Form\Contract\Renderer\FormRendererInterface:
        class: Derafu\Form\Renderer\FormRenderer
        arguments:
            $renderer: '@Derafu\Renderer\Contract\RendererInterface'
            $csrfTokenManager: '@?Derafu\Form\Contract\Csrf\CsrfTokenManagerInterface'
            $captchaProvider: '@?Derafu\Form\Contract\Captcha\CaptchaProviderInterface'

    Derafu\Form\Renderer\FormExtensionProvider:
        tags: ['derafu_twig.extension_provider']

    Derafu\Form\Renderer\FormTemplatePathProvider:
        tags:
            - { name: derafu_twig.template_path_provider, priority: -1000 }

    Derafu\Form\Contract\Factory\FormFactoryInterface:
        class: Derafu\Form\Factory\FormFactory

    # Translates the texts of the definitions that have `options.translation_domain`, in
    # the language of the translator (see Derafu\Form\Translation\FormTexts).
    # It needs the translator of derafu/translation-services.yaml.
    Derafu\Form\Factory\TranslatingFormFactory:
        decorates: Derafu\Form\Contract\Factory\FormFactoryInterface
        arguments:
            $inner: '@.inner'

    # Loaders of the definitions in `resources/forms` of the application
    # (`<name>.form.php` and `<name>.form.yaml`). They are private, so an
    # application that does not use them does not have them in its container.
    # `FormLoaderInterface` is not set: which loader it is, or a chain of them,
    # is a decision of each application.
    Derafu\Form\Loader\PhpFormLoader:
        arguments:
            $paths: ['%kernel.project_dir%/resources/forms']

    Derafu\Form\Loader\YamlFormLoader:
        arguments:
            $paths: ['%kernel.project_dir%/resources/forms']

    Derafu\Form\Contract\Type\TypeResolverInterface:
        class: Derafu\Form\Type\TypeResolver

    Derafu\Form\Contract\Type\TypeRegistryInterface:
        class: Derafu\Form\Type\TypeRegistry
        arguments:
            $types: '@Derafu\Form\Contract\Type\TypeProviderInterface'

    Derafu\Form\Contract\Type\TypeProviderInterface:
        class: Derafu\Form\Type\TypeProvider

    Derafu\Form\Contract\Processor\UiSchemaRuleEvaluatorInterface:
        class: Derafu\Form\Processor\UiSchemaRuleEvaluator

    Derafu\Form\Contract\Processor\FormDataProcessorInterface:
        class: Derafu\Form\Processor\FormDataProcessor

    Derafu\Form\Contract\Processor\FormRulesResolverInterface:
        class: Derafu\Form\Processor\FormRulesResolver
